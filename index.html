<script>
(async function () {
  const MESH = {};

  const params = new URLSearchParams(location.search);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touchOnly = window.matchMedia('(hover: none)').matches;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  /* ---------- 行列 ---------- */
  function perspective(fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy / 2);
    return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]);
  }
  function lookAt(e, c, up) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0, -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
  }
  function mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; }
    return o;
  }

  /* ---------- シェーダー ---------- */
  function prog(vs, fs) {
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };

    look(0.9); await wait(700); look(-0.9); await wait(700); look(0.4); await wait(300);
    await talk('havel', '俺には何も見えないんだが…');
    await talk('unicorn', 'また明日！');
    await wait(600);
    music.se('clear'); await fadeTo(true, 1400);
    await showCG('cg_dusk'); await fadeTo(false, 800); await wait(1200);
    el('clearlogo').classList.add('on'); mode = 'end'; objective(''); itemsEl.classList.remove('on');
  }

  /* --- 場面ごとのきっかけ --- */
  story_onTrigger = id => {
    if (id === 'window' && !FLG.window) return run(windowEvent);
    if (id === 'stairsDown') return run(async () => {
      if (!FLG.cero) { await talk('asti', 'まずは、窓をあけてみようかな。'); return; }
      await goScene('ground', () => placeParty(-2.0, 1.5, 0)); if (!FLG.met) objective('外に出てみよう（正面の戸口）', [0, 1.6, -2.4]);
    });
    if (id === 'stairsUp') return run(() => goScene('bedroom', () => placeParty(1.5, 1.0, Math.PI)));
    if (id === 'door') return run(async () => {
      await goScene('hill', () => { placeParty(0, -2.7, 0); placeE('havel', 3.4, -3.2, -1.2); });
      if (!FLG.met) {
        FLG.met = true; await wait(400);
        await talk('havel', 'アスティ、今日はどこへでかけるんだ？'); await talk('asti', '「風の杖」があればいけるんだけど…');
        objective('風の杖をさがそう。風車小屋のまわりを歩いてみよう（左のほうに、子羊の小屋がある）');
      } else if (!FLG.used) objective(FLG.staff ? '風車小屋の玄関で、アイテム「風の杖」をつかおう' : '風の杖をさがそう（左のほうの、子羊の小屋）');
    });
    if (id === 'staff' && FLG.met && !FLG.staff) return run(async () => {
      FLG.staff = true; setMark(); await talk('asti', 'あった！'); music.se('get'); addItem('windStaff');
      await notice('風の杖を手に入れた！'); objective('風車小屋の玄関まで戻って、アイテム「風の杖」をつかおう', [0, 2.6, -3.4]);
    });
    if (id === 'entrance') { inEntrance = true; if (FLG.staff && !FLG.used) { glowItem('windStaff'); itemSay('アイテムの「風の杖」を、クリックしてみよう'); } }
  };
  async function useItem(id) {
    if (LOCK > 0 || mode !== 'play') return;
    if (id === 'windStaff' && FLG.staff && !FLG.used && SCN.id === 'hill' && inEntrance) { await run(async () => { await staffEvent(); await goScene('forest', () => { followers.length = 0; followers.push('havel'); ENT.unicorn.vis = false; ENT.cero.vis = false; placeParty(0, 7.5, Math.PI); ENT.asti.dirX = 0; }); await forestIntro(); }); return; }
    itemSay('ここでは、使えないようだ…');
  }
  async function forestIntro() {
    await caption('― 森 ―', 1500); await showCG('cg_field'); await wait(1600); await hideCG();
    objective('苺をあつめよう（0こ）'); setMark();
  }
  function storyTick() {
    const a = ENT.asti;
    if (SCN.id === 'hill') { const t = SCN.triggers.find(q => q.id === 'entrance'); if (t && inEntrance && Math.hypot(a.x - t.x, a.z - t.z) > t.r + 0.3) { inEntrance = false; glowItem(''); } if (FLG.met && !FLG.staff && LOCK === 0) setMark(-17.0, 1.9, -2.3); }
    if (SCN.id === 'forest' && LOCK === 0) for (const b of SCN.berries) {
      if (b.got || Math.hypot(a.x - b.x, a.z - b.z) > 0.95) continue;
      b.got = true; b.d.hide = true; FLG.berries++; music.se('berry'); objective('苺をあつめよう（' + FLG.berries + 'こ）');
      if (FLG.berries >= 3 && !FLG.hunt) { run(monsterEvent); break; }
    }
  }

  /* --- はじまり --- */
  async function beginGame() {
    if (mode !== 'title') return; mode = 'play'; titleEl.classList.add('off'); music.start();
    fadeEl.style.transitionDuration = '0ms'; fadeEl.classList.add('on'); await wait(60);
    loadScene('bedroom'); followers.length = 0; placeE('asti', -2.3, -0.55, 0);
    const a = ENT.asti; a.lie = 1; a.y = 0.66; armTriggers();
    el('ui').classList.add('on'); itemsEl.classList.add('on');
    await run(async () => {
      await fadeTo(false, 1600); await wait(500);
      await tween(1300, k => { const e = ease(k); a.lie = 1 - e; a.y = 0.66 * (1 - e); a.x = lerp(-2.3, -1.45, e); a.z = lerp(-0.55, -0.45, e); });
      await talk('asti', '今日もいい天気！');
    });
    objective('小屋の中を歩いて、窓のそばへ行ってみよう', [1.2, 1.7, -2.2]);
    const hint = el('hint'); hint.textContent = touchOnly ? 'タップで歩く　／　ドラッグで見まわす　／　吹き出しをタップで次へ' : '矢印キー・WASD で歩く　／　クリックで、その場所へ　／　F：顔アップ　／　セリフは、クリックで進む';
    hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 11000);
  }

  /* ===== 起動 ===== */
  loadScene('hill'); placeE('asti', -1.5, -1.8, 0.6); ENT.asti.pop = 1;
  { const ok = await loadModel('asti'); if (!ok) { el('msg').textContent = 'アスティのデータを読みこめませんでした。ネットにつながる場所で、もう一度ひらいてください。'; el('msg').style.display = 'flex'; return; } }
  { const hv = await loadModel('havel'); if (hv) ENT.havel.type = 'mesh'; const ce = await loadModel('cero'); if (ce) ENT.cero.type = 'mesh'; const un = await loadModel('unicorn'); if (un) ENT.unicorn.type = 'mesh'; }
  el('tbg').style.backgroundImage = 'url(' + ASSET.title_bg + ')';
  el('start').disabled = false; el('start').textContent = 'はじめる'; el('start').addEventListener('click', beginGame);
  el('again').addEventListener('click', () => location.reload());
  let last = performance.now(), ema = 16, lastAdapt = 0;
  function frame(now) {
    const raw = now - last, dt = Math.min(0.08, raw / 1000); last = now; time += dt; ema = ema * 0.92 + Math.min(raw, 250) * 0.08;
    if (!params.has('q') && now - lastAdapt > 1600 && ema > 36 && QUAL > 0.5) { QUAL = Math.max(0.5, QUAL * 0.8); lastAdapt = now; resize(); }
    WIND.spin += WIND.rate * dt;
    for (const p of [ENT.asti]) { if (p.vis) { p.pop = Math.min(1, p.pop + dt * 3); } }
    for (const id of ['cero', 'havel', 'unicorn']) { const e = ENT[id]; if (e.vis && e.pop < 1 && !e._hold) e.pop = Math.min(1, e.pop + dt * 3); }
    if (mode === 'play' || mode === 'end') {
      updateAsti(dt); updateOthers(dt);
      if (mode === 'play' && LOCK === 0) { const a = ENT.asti; for (const t of SCN.triggers) { const inside = Math.hypot(a.x - t.x, a.z - t.z) < t.r; if (inside && !t.in) { t.in = true; story_onTrigger(t.id); } else if (!inside) t.in = false; } }
      storyTick();
    } else if (mode === 'title') { cam.yaw += dt * 0.05; }
    if (mode !== 'title') {
      const c = SCN.cam, a = ENT.asti; let tx, ty, tz;
      if (cam.focus && ENT[cam.focus]) { const fe = ENT[cam.focus], fK = kindOf(fe), fw = (fK && fK.headFwd) || 0; tx = fe.x + Math.sin(fe.yaw) * fw; tz = fe.z + Math.cos(fe.yaw) * fw; ty = headYOf(fe); }
      else { tx = lerp(c.tx, a.x, c.follow); tz = lerp(c.tz, a.z, c.follow); ty = SCN.type === 'room' ? c.ty : 1.0; }
      const k = 1 - Math.exp(-5 * dt); cam.tx += (tx - cam.tx) * k; cam.tz += (tz - cam.tz) * k; cam.ty += (ty - cam.ty) * k;
    }
    const kk = 1 - Math.exp(-3.5 * dt);
    if (cam.dTarget != null) { cam.dist += (cam.dTarget - cam.dist) * kk; if (Math.abs(cam.dTarget - cam.dist) < 0.01) cam.dTarget = null; }
    if (cam.pTarget != null) { cam.pitch += (cam.pTarget - cam.pitch) * kk; if (Math.abs(cam.pTarget - cam.pitch) < 0.003) cam.pTarget = null; }
    if (cam.yTarget != null) { let dy = cam.yTarget - cam.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); cam.yaw += dy * kk; if (Math.abs(dy) < 0.01) cam.yTarget = null; }
    if (window.__dbg && window.__dbg.force) { const F = window.__dbg.force; for (const k of Object.keys(ENT)) { ENT[k].ph = F.ph; ENT[k].mv = F.mv; } }
    updateCamera(); placeBubble(); updateMark(); render();
    requestAnimationFrame(frame);
  }
  if (params.has('debug')) window.__dbg = { ENT, cam, FLG, FLAGS, WIND, loadScene, placeE, placeParty, get SCN() { return SCN; }, followers, music, advance, say, talk, run, goScene, setMode: m => { mode = m; }, beginGame, story: () => story_onTrigger, inv, force: null, get LOCK() { return LOCK; }, get mode() { return mode; }, windowEvent, staffEvent, monsterEvent, duskEvent, forestIntro };
  requestAnimationFrame(frame);

})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').then(function (r) { r.update(); }).catch(function () {}); });
}
</script>
